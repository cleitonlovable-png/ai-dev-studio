name: Build Windows (.exe)

# Roda sob demanda (aba Actions -> Run workflow) e tambem a cada push
# na main, para sempre ter um instalador atualizado disponivel.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependencias Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias do frontend
        run: npm ci

      # Cada build ganha um numero de versao maior que o anterior
      # (0.1.<numero da execucao>). E isso que o atualizador automatico
      # compara para saber se existe versao nova.
      - name: Definir versao do app
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = $v
          $json | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build do AI Dev Studio (.exe + instaladores)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Se o build falhar, publica os erros do Rust como anotacoes do
      # run (os logs brutos ficam em storage inacessivel para o Claude).
      - name: Resumir erros do build
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content build.log
          $n = 0
          for ($i = 0; $i -lt $lines.Count -and $n -lt 8; $i++) {
            if ($lines[$i] -match '^\s*error') {
              $end = [Math]::Min($i + 9, $lines.Count - 1)
              $msg = ($lines[$i..$end] -join '%0A')
              Write-Output "::error title=rust error $n::$msg"
              $n++
            }
          }
          if ($n -eq 0) {
            $tail = ($lines | Select-Object -Last 25) -join '%0A'
            Write-Output "::error title=build tail::$tail"
          }

      # Os instaladores saem em src-tauri/target/release/bundle/.
      # Sobem como artifact do workflow, baixavel na aba Actions do repo.
      - name: Publicar instaladores (NSIS .exe)
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Publicar instaladores (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-msi-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Publicar executavel bruto
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: ignore

      # latest.json e o arquivo que o app instalado consulta para saber se
      # existe versao nova (versao, link do instalador e assinatura).
      - name: Gerar latest.json do atualizador
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $assetName = $exe.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/latest/$assetName"
          $manifest = [ordered]@{
            version  = $env:APP_VERSION
            notes    = "Atualizacao automatica do commit ${{ github.sha }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig.Trim(); url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "latest.json" -Encoding utf8

      # Artifacts do Actions ficam em Azure Blob Storage, que nem sempre
      # e acessivel por fora do GitHub (ex: proxies corporativos). Uma
      # GitHub Release publica o arquivo direto no dominio do GitHub,
      # entao ele fica baixavel por qualquer ferramenta que acesse
      # github.com normalmente. Cada execucao sobrescreve a tag "latest".
      - name: Publicar GitHub Release com os instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AI Dev Studio — build automatico"
          body: "Build automatico gerado pelo GitHub Actions a partir do commit ${{ github.sha }}."
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
