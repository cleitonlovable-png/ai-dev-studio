name: Build Windows (.exe)

# Roda sob demanda (aba Actions -> Run workflow) e tambem a cada push
# na main, para sempre ter um instalador atualizado disponivel.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependencias Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias do frontend
        run: npm ci

      - name: Build do AI Dev Studio (.exe + instaladores)
        run: npm run tauri build

      # Os instaladores saem em src-tauri/target/release/bundle/.
      # Sobem como artifact do workflow, baixavel na aba Actions do repo.
      - name: Publicar instaladores (NSIS .exe)
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Publicar instaladores (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-msi-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Publicar executavel bruto
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: ignore

      # Artifacts do Actions ficam em Azure Blob Storage, que nem sempre
      # e acessivel por fora do GitHub (ex: proxies corporativos). Uma
      # GitHub Release publica o arquivo direto no dominio do GitHub,
      # entao ele fica baixavel por qualquer ferramenta que acesse
      # github.com normalmente. Cada execucao sobrescreve a tag "latest".
      - name: Publicar GitHub Release com os instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AI Dev Studio — build automatico"
          body: "Build automatico gerado pelo GitHub Actions a partir do commit ${{ github.sha }}."
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
