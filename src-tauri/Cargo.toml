[package]
name = "ai-dev-studio"
version = "0.1.0"
description = "AI Dev Studio - camada de gerenciamento de projetos de desenvolvimento"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[features]
# Isso ativa o modo de "sidecar" de desenvolvimento do Tauri (hot-reload).
custom-protocol = ["tauri/custom-protocol"]
